name: Horizon fork

# Builds the fork with its own branding (HORIZON_FORK=ON) and runs the unit
# tests on the three desktop platforms. Unlike Prism's own workflow this does
# not sign or publish anything: signing keys belong to whoever distributes the
# build (see fork/M6.md).

on:
  push:
    branches:
      - horizon/latest
      - 'horizon/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.artifact-name }})

    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 is the image whose vcpkg binary cache (GitHub Packages)
          # already holds the universal dependencies, so it reuses compiled
          # packages instead of rebuilding them. Its arm64 pool is sometimes
          # starved; rerun the macOS job if it is cancelled while queued.
          - os: macos-26
            artifact-name: macOS
            qt-version: 6.11.2
            macosx-deployment-target: 13.0
            cmake-osx-architectures: x86_64;arm64

          - os: ubuntu-24.04
            artifact-name: Linux
            qt-version: 6.11.2
            cmake-osx-architectures: ''

          - os: windows-2022
            artifact-name: Windows-MSVC
            vcvars-arch: amd64
            qt-version: 6.11.2
            cmake-osx-architectures: ''

    runs-on: ${{ matrix.os }}

    # Same shell as Prism's workflow: on Windows the default PowerShell does
    # not expand $CMAKE_PRESET, which silently dropped the preset and left the
    # vcpkg toolchain unused.
    defaults:
      run:
        shell: bash

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: horizon-prism
      BUILD_TYPE: Debug
      CMAKE_PRESET: default
      CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake-osx-architectures }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      - name: Configure
        run: >-
          cmake --preset "$CMAKE_PRESET" -D HORIZON_FORK=ON
          -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET"
          -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"

      - name: Build
        run: cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Test
        run: ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE" --output-on-failure

      - name: Package (macOS, unsigned)
        if: ${{ runner.os == 'macOS' }}
        run: |
          # Prism deploys Qt (frameworks, plugins, icon, jars) from the install
          # rules, not from the build tree, so package an installed bundle.
          cmake --install build --config "$BUILD_TYPE" --prefix install
          app="install/horizon-prism.app"
          test -d "$app/Contents/Frameworks/QtCore.framework"
          test -f "$app/Contents/Resources/HorizonPrismLauncher.icns"
          plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist" \
            | grep -qx 'dev.playhorizon.HorizonPrismLauncher'
          # Ad-hoc signature: still not notarized, but a valid signature keeps
          # Apple silicon from reporting the bundle as damaged. Prism keeps its
          # launcher jars under Contents/MacOS, which codesign treats as nested
          # code, so the jars are signed before the bundle; otherwise the seal
          # never validates.
          codesign --force --sign - "$app/Contents/MacOS/jars/"*.jar
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" HorizonPrismLauncher-macOS-unsigned.zip

          # The jar signatures live in extended attributes, so check that the
          # archive keeps them: this is what a user's extraction produces.
          rm -rf verify && mkdir verify
          ditto -x -k HorizonPrismLauncher-macOS-unsigned.zip verify
          codesign --verify --deep --strict verify/horizon-prism.app

      - name: Package (Linux, unsigned)
        if: ${{ runner.os == 'Linux' }}
        run: |
          # Prism installs the binary under bin/ and the jars under
          # share/horizon-prism; lib4bin (sharun) copies the Qt and system
          # libraries the binary needs into the same tree, so the tarball runs
          # without a system Qt.
          cmake --install build --config "$BUILD_TYPE" --prefix install
          test -x install/bin/horizon-prism
          sharun lib4bin --hard-links --with-hooks --dst-dir install \
            install/bin/* "$QT_PLUGIN_PATH"/*/*.so
          find install -name '*gamemode*' -delete
          tar -czf HorizonPrismLauncher-Linux-x86_64-unsigned.tar.gz -C install .

      - name: Package (Windows, unsigned)
        if: ${{ runner.os == 'Windows' }}
        run: |
          # The install rules deploy Qt and the linked DLLs on Windows, so the
          # installed tree is the portable package.
          cmake --install build --config "$BUILD_TYPE" --prefix install
          test -f install/horizon-prism.exe
          "/c/Program Files/7-Zip/7z.exe" a -tzip \
            HorizonPrismLauncher-Windows-x86_64-unsigned.zip ./install/*

      - name: Upload macOS artifact
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: HorizonPrismLauncher-macOS-unsigned
          path: HorizonPrismLauncher-macOS-unsigned.zip
          if-no-files-found: error

      - name: Upload Linux artifact
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: HorizonPrismLauncher-Linux-x86_64-unsigned
          path: HorizonPrismLauncher-Linux-x86_64-unsigned.tar.gz
          if-no-files-found: error

      - name: Upload Windows artifact
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: HorizonPrismLauncher-Windows-x86_64-unsigned
          path: HorizonPrismLauncher-Windows-x86_64-unsigned.zip
          if-no-files-found: error
